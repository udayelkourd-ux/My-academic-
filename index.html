<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية فانتازي</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; background: #0f172a; color: white;
            display: flex; justify-content: center; align-items: center; height: 100vh; 
        }
        .box { 
            background: #1e293b; padding: 30px; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 85%; max-width: 350px; text-align: center; 
        }
        h2 { margin-bottom: 25px; color: #38bdf8; }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; background: #334155; 
            border: none; border-radius: 8px; color: white; box-sizing: border-box;
        }
        button { 
            width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>أكاديمية فانتازي</h2>
        <input type="text" placeholder="اسم المستخدم">
        <input type="password" placeholder="كلمة المرور">
        <button onclick="alert('جاري تسجيل الدخول...')">دخول</button>
    </div>
</body>
</html>
