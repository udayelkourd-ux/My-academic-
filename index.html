<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم كابتن Oday</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; }
        button { width: 100%; padding: 10px; background: #38bdf8; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="adminPanel" class="box">
        <h2>إضافة لاعب جديد</h2>
        <input type="text" id="pName" placeholder="اسم اللاعب">
        <input type="text" id="pPhone" placeholder="رقم الجوال">
        <input type="date" id="pBirth">
        <label><input type="checkbox" id="pFee"> دفع الرسوم الشهرية؟</label>
        <label><input type="checkbox" id="pKit"> دفع رسوم الزي؟</label>
        <input type="number" id="pDone" placeholder="عدد التمارين المنجزة">
        <button onclick="savePlayer()">حفظ وإصدار البطاقة</button>
    </div>

    <script>
        function savePlayer() {
            // هنا يتم حفظ البيانات في مصفوفة برمجية
            let player = {
                name: document.getElementById('pName').value,
                phone: document.getElementById('pPhone').value,
                fee: document.getElementById('pFee').checked ? "مدفوع" : "غير مدفوع",
                kit: document.getElementById('pKit').checked ? "مدفوع" : "غير مدفوع"
            };
            
            // إصدار اسم مستخدم وكلمة مرور للاعب تلقائياً
            let username = player.name.replace(/\s+/g, '').toLowerCase();
            let password = Math.floor(1000 + Math.random() * 9000);
            
            alert("تم إضافة اللاعب بنجاح!\nاسم المستخدم: " + username + "\nكلمة المرور: " + password);
        }
    </script>
</body>
</html>
