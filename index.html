<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أكاديمية فانتازي - تسجيل الدخول</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 20px; width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #334155; border: none; border-radius: 8px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="user" placeholder="اسم المستخدم">
        <input type="password" id="pass" placeholder="كلمة المرور">
        <button onclick="checkLogin()">دخول</button>
    </div>

    <script>
        function checkLogin() {
            let user = document.getElementById("user").value;
            let pass = document.getElementById("pass").value;

            // نظام الصلاحيات
            if (user === "Captain" && pass === "123456") {
                alert("أهلاً بك يا كابتن Oday في لوحة التحكم");
                // هنا سنوجهك لاحقاً لصفحة الإدارة
            } else if (user === "Player" && pass === "player123") {
                alert("مرحباً بك في الأكاديمية");
                // هنا سيذهب اللاعب لبطاقته
            } else {
                alert("خطأ: غير مصرح لك بالدخول، يرجى التواصل مع الكابتن.");
            }
        }
    </script>
</body>
</html>
